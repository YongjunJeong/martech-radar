{% extends "base.html" %}
{% block content %}
<div class="login">
  <h1>{{ t('login.title') }}</h1>
  <p class="note">{{ t('login.hint') }}</p>
  {% if bad %}<p class="empty warn">{{ t('login.bad') }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="token" autocomplete="current-password"
           placeholder="{{ t('login.token') }}" required autofocus>
    <button type="submit">{{ t('login.submit') }}</button>
  </form>
</div>
{% endblock %}
