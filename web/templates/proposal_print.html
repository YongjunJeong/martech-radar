<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>{{ c.company }} 제안서 초안</title><style>body{font:15px/1.8 sans-serif;max-width:850px;margin:40px auto;color:#18231f}h1{font-size:28px}pre{white-space:pre-wrap;font:inherit}a{overflow-wrap:anywhere;color:#0f766e}small{color:#56665d}@media print{button{display:none}body{margin:0}a{color:inherit}}@page{size:A4;margin:20mm}</style></head><body><button onclick="window.print()">인쇄 / PDF로 저장</button><h1>{{ c.company }} 제안서 초안</h1><small>고객과 논의할 가설입니다. 실제 운영 조건과 목표는 미팅에서 확인하고 합의합니다.</small><pre>{{ d.proposal }}</pre><h2>참고 자료</h2>{% for s in sources %}<p><strong>[{{ s.id }}] {{ s.title }}</strong>{% for link in s.links %}<br><a href="{{ link.url }}">{{ link.url }}</a>{% endfor %}</p>{% endfor %}</body></html>
