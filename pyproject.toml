[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martech-radar"
version = "0.1.0"
description = "Vendor-neutral website technology observation and change detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "Jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.5"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools]
packages = ["radar", "web"]

[tool.setuptools.package-data]
# The package must carry everything it reads at runtime. A deployment may
# *override* fingerprints in its workspace, but never needs to supply them.
radar = ["probe.js", "fingerprints/*.yaml"]
web = ["templates/*.html", "static/*"]
